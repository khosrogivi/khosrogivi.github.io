<body>
<header>
  <h1>KHOSRO GIVI — CURRICULUM VITAE</h1>
  <p>IT Infrastructure | Network | Systems | IT Support · Muscat, Oman</p>
</header>

<div class="actions">
  <a href="Khosrow_Givi_Oman_Resume_2026-10.pdf" target="_blank">OPEN CV</a>
  <a class="secondary" href="Khosrow_Givi_Oman_Resume_2026-10.pdf" download>DOWNLOAD PDF</a>
  <a class="secondary" href="https://khosrogivi.github.io/">BACK TO PROFILE</a>
</div>

<div class="viewer" id="viewer"><div class="loading">Loading CV…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const PDF_URL = 'Khosrow_Givi_Oman_Resume_2026-10.pdf';
const viewer = document.getElementById('viewer');
let pdfDoc = null;

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function renderAll() {
  if (!pdfDoc) return;
  const dpr = window.devicePixelRatio || 1;
  const availW = viewer.clientWidth - 20;
  const availH = viewer.clientHeight - 14;
  const frag = document.createDocumentFragment();
  const jobs = [];

  for (let i = 1; i <= pdfDoc.numPages; i++) {
    const page = await pdfDoc.getPage(i);
    const base = page.getViewport({ scale: 1 });
    // whole page fits both width and height of the screen
    const fit = Math.min(availW / base.width, availH / base.height);
    const vp = page.getViewport({ scale: fit * dpr });
    const c = document.createElement('canvas');
    c.width = Math.floor(vp.width);
    c.height = Math.floor(vp.height);
    c.style.width = Math.floor(vp.width / dpr) + 'px';
    c.style.height = Math.floor(vp.height / dpr) + 'px';
    frag.appendChild(c);
    jobs.push(() => page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise);
  }
  viewer.innerHTML = '';
  viewer.appendChild(frag);
  for (const j of jobs) await j();
}

function showFallback() {
  viewer.innerHTML = '<iframe class="fallback" src="' + PDF_URL +
    '#view=Fit&navpanes=0&toolbar=0" title="Khosro Givi CV"></iframe>';
}

pdfjsLib.getDocument(PDF_URL).promise
  .then(d => { pdfDoc = d; return renderAll(); })
  .catch(showFallback);

let t;
window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(renderAll, 200); });
window.addEventListener('orientationchange', () => setTimeout(renderAll, 300));
</script>
</body>
</html>
